name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    # GitHub does not apply path filters to tag pushes.
    tags:
      - 'v*'
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/*.yml"
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/*.yml"
  release:
    types: [ published ]

permissions:
  contents: read

jobs:

  verify:
    uses: ./.github/workflows/build-check.yml

  prepare-release:
    needs: verify
    if: github.repository == 'HoshinoNeko/XrayR' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create a draft only after regression and platform checks pass
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const marker = `<!-- xrayr-security-release:${context.sha} -->`;
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            let release = releases.find(candidate => candidate.tag_name === tag);
            if (release) {
              // Resume only this exact commit's own incomplete draft, never an existing publication.
              if (!release.draft || !release.body?.includes(marker)) {
                throw new Error(`Refusing to overwrite existing release ${tag}`);
              }
            } else {
              ({data: release} = await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `XrayR ${tag}`,
                draft: true,
                prerelease: false,
                body: [
                  marker,
                  '## Security update',
                  '- Updates the patched HoshinoNeko/Xray-core dependency to v26.10.31.',
                  '- Disables MPTCP by default while retaining TLS certificate snapshot and Hysteria2 UDP integrity fixes.',
                  '- Includes full and minimal binaries; supported full binaries use UPX --best --lzma.',
                  '',
                  'Disabling MPTCP reduces the demonstrated attack surface; it does not repair CVE-2026-98432 in the kernel. Update the host Linux/Android kernel as well.',
                  '',
                  'Published only after security regressions, cross-platform build checks, and all release asset builds succeed.'
                ].join('\n')
              }));
            }
            core.setOutput('release_id', String(release.id));

  build:
    needs: [verify, prepare-release]
    if: always() && github.repository == 'HoshinoNeko/XrayR' && needs.verify.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    permissions:
      contents: write
    strategy:
      matrix:
        # Include amd64 on all platforms.
        goos: [ windows, freebsd, openbsd, linux, darwin ]
        goarch: [ amd64, 386 ]
        exclude:
          # Exclude i386 on darwin.
          - goarch: 386
            goos: darwin
          - goarch: 386
            goos: openbsd
        include:
          # BEIGIN MacOS ARM64
          - goos: darwin
            goarch: arm64
          # END MacOS ARM64
          # BEGIN Linux ARM 5 6 7
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 5
          # END Linux ARM 5 6 7
          # BEGIN Android ARM 8
          - goos: android
            goarch: arm64
          # END Android ARM 8
          # BEGIN Other architectures
          # BEGIN riscv64 & ARM64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: riscv64
          # END riscv64 & ARM64
          # BEGIN MIPS
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips
          # END MIPS
          # BEGIN PPC
          # - goos: linux # Removed due to the unsupport of shirou/gopsutil 
          #   goarch: ppc64
          - goos: linux
            goarch: ppc64le
          # END PPC
          # BEGIN FreeBSD ARM
          - goos: freebsd
            goarch: arm64
          - goos: freebsd
            goarch: arm
            goarm: 7
          # END FreeBSD ARM
          # BEGIN S390X
          - goos: linux
            goarch: s390x
          # END S390X
          # END Other architectures
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
      - name: Show workflow information
        id: get_filename
        run: |
          export _NAME=$(jq ".[\"$GOOS-$GOARCH$GOARM$GOMIPS\"].friendlyName" -r < .github/build/friendly-filenames.json)
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, GOMIPS: $GOMIPS, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get project dependencies
        run: go mod download


      - name: Build XrayR
        run: |
          mkdir -p build_assets
          ldflags="-s -w -buildid="
          # anet uses net internals on Android; match the pinned core's build flags.
          if [ "$GOOS" = "android" ]; then
            ldflags="$ldflags -checklinkname=0"
          fi
          go build -mod=readonly -v -o build_assets/XrayR -trimpath -ldflags "$ldflags"

      - name: Build Mips softfloat XrayR
        if: matrix.goarch == 'mips' || matrix.goarch == 'mipsle'
        run: |
          GOMIPS=softfloat go build -v -o build_assets/XrayR_softfloat -trimpath -ldflags "-s -w -buildid="
      - name: Rename Windows XrayR
        if: matrix.goos == 'windows'
        run: |
          cd ./build_assets || exit 1
          mv XrayR XrayR.exe

      - name: Prepare to release
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 60
          retry_wait_seconds: 60
          max_attempts: 5
          command: |
            cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
            cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE
            cp ${GITHUB_WORKSPACE}/release/config/dns.json ./build_assets/dns.json
            cp ${GITHUB_WORKSPACE}/release/config/route.json ./build_assets/route.json
            cp ${GITHUB_WORKSPACE}/release/config/custom_outbound.json ./build_assets/custom_outbound.json
            cp ${GITHUB_WORKSPACE}/release/config/custom_inbound.json ./build_assets/custom_inbound.json
            cp ${GITHUB_WORKSPACE}/release/config/rulelist ./build_assets/rulelist
            cp ${GITHUB_WORKSPACE}/release/config/config.yml.example ./build_assets/config.yml
            LIST=('geoip geoip geoip' 'domain-list-community dlc geosite')
            for i in "${LIST[@]}"
            do
              INFO=($(echo $i | awk 'BEGIN{FS=" ";OFS=" "} {print $1,$2,$3}'))
              DOWNLOAD_URL="https://raw.githubusercontent.com/v2fly/${INFO[0]}/release/${INFO[1]}.dat"
              FILE_NAME="${INFO[2]}.dat"
              echo -e "Downloading ${DOWNLOAD_URL}..."
              curl -L "${DOWNLOAD_URL}" -o ./build_assets/${FILE_NAME}
              echo -e "Verifying HASH key..."
              HASH="$(curl -sL "${DOWNLOAD_URL}.sha256sum" | awk -F ' ' '{print $1}')"
              [ "$(sha256sum "./build_assets/${FILE_NAME}" | awk -F ' ' '{print $1}')" == "${HASH}" ] || { echo -e "The HASH key of ${FILE_NAME} does not match cloud one."; exit 1; }
            done
      - name: Build minimal edition
        shell: bash
        run: |
          cp -R build_assets build_assets-minimal
          cp docs/minimal.md build_assets-minimal/MINIMAL.md
          # Keep the existing example paths, but do not suggest an unavailable ACME mode.
          sed -i 's/CertMode: dns/CertMode: file/g' build_assets-minimal/config.yml
          ldflags="-s -w -buildid="
          binary=XrayR
          if [ "$GOOS" = "windows" ]; then binary=XrayR.exe; fi
          if [ "$GOOS" = "android" ]; then ldflags="$ldflags -checklinkname=0"; fi
          go build -mod=readonly -tags minimal -trimpath -ldflags "$ldflags" -o "build_assets-minimal/$binary"
          if [ "$GOARCH" = "mips" ] || [ "$GOARCH" = "mipsle" ]; then
            GOMIPS=softfloat go build -mod=readonly -tags minimal -trimpath -ldflags "$ldflags" -o build_assets-minimal/XrayR_softfloat
          fi
      - name: Pack full edition with UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl
          for binary in build_assets/XrayR build_assets/XrayR.exe build_assets/XrayR_softfloat; do
            if [ -f "$binary" ]; then sh .github/build/pack-full.sh "$binary"; fi
          done
          if [ "$GOOS" = linux ] && [ "$GOARCH" = amd64 ]; then
            ./build_assets/XrayR --help
          fi
      - name: Create ZIP archives
        shell: bash
        run: |
          for suffix in "" "-minimal"; do
            pushd "build_assets$suffix" || exit 1
            touch -mt $(date +%Y01010000) *
            zip -9vr "../XrayR-$ASSET_NAME$suffix.zip" .
            popd || exit 1
            FILE="./XrayR-$ASSET_NAME$suffix.zip"
            DGST=$FILE.dgst
            for METHOD in {"md5","sha1","sha256","sha512"}; do
              openssl dgst -$METHOD "$FILE" | sed 's/([^)]*)//g' >>"$DGST"
            done
          done
      - name: Change the name
        run: |
          mv build_assets XrayR-$ASSET_NAME
          mv build_assets-minimal XrayR-$ASSET_NAME-minimal
      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XrayR-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: |
            ./XrayR-${{ steps.get_filename.outputs.ASSET_NAME }}/*
      - name: Upload minimal files to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XrayR-${{ steps.get_filename.outputs.ASSET_NAME }}-minimal
          path: ./XrayR-${{ steps.get_filename.outputs.ASSET_NAME }}-minimal/*
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./XrayR-${{ steps.get_filename.outputs.ASSET_NAME }}.zip*
          tag: ${{ github.ref }}
          release_id: ${{ needs.prepare-release.outputs.release_id || github.event.release.id }}
          draft: ${{ github.event_name == 'push' }}
          overwrite: ${{ github.event_name == 'push' }}
          file_glob: true
      - name: Upload minimal binaries to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./XrayR-${{ steps.get_filename.outputs.ASSET_NAME }}-minimal.zip*
          tag: ${{ github.ref }}
          release_id: ${{ needs.prepare-release.outputs.release_id || github.event.release.id }}
          draft: ${{ github.event_name == 'push' }}
          overwrite: ${{ github.event_name == 'push' }}
          file_glob: true
      # Optional compressed copies: never overwrite or upload these to Releases.
      - name: Install UPX for Actions-only copies
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        id: install_upx
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl
          upx --version
      - name: Pack UPX copies
        if: (github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && steps.install_upx.outcome == 'success'
        run: bash .github/build/upx-artifacts.sh
      - name: Upload UPX copies to Actions only
        if: (github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && steps.install_upx.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: XrayR-${{ steps.get_filename.outputs.ASSET_NAME }}-upx
          path: ./upx_artifacts/*
          compression-level: 0
          if-no-files-found: error

  publish-release:
    needs: [prepare-release, build]
    if: github.repository == 'HoshinoNeko/XrayR' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the completed draft without replacing another release
        uses: actions/github-script@v7
        with:
          script: |
            const release_id = Number('${{ needs.prepare-release.outputs.release_id }}');
            const {data: release} = await github.rest.repos.getRelease({...context.repo, release_id});
            const tag = context.ref.replace('refs/tags/', '');
            if (!release.draft || release.tag_name !== tag || !release.body?.includes(`<!-- xrayr-security-release:${context.sha} -->`)) {
              throw new Error('Release no longer matches this verified draft');
            }
            await github.rest.repos.updateRelease({...context.repo, release_id, draft: false});
